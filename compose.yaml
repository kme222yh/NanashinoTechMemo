# ローカル開発用 WordPress + MySQL
# データはすべて ./.docker 配下に保存される
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-wordpress}
      MYSQL_USER: ${DB_USER:-wordpress}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - ./.docker/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:${WP_IMAGE_TAG:-php8.3-apache}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8000}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-tech}
      WORDPRESS_DEBUG: ${WP_DEBUG:-1}
      # エラーは画面に出さず wp-content/debug.log に出力する
      # (画面に出すと古いプラグインの Deprecated でリダイレクトが壊れるため)
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_DISPLAY', (bool) getenv('WP_DEBUG_DISPLAY'));
        define('WP_DEBUG_LOG', true);
      WP_DEBUG_DISPLAY: ${WP_DEBUG_DISPLAY:-0}
    volumes:
      - ./.docker/wordpress:/var/www/html
      # npm run build / watch の出力 (dist) をテーマとしてマウント
      # パスは package.json の --base=/wp-content/themes/nanashinotechmemo/ に合わせている
      - ./dist:/var/www/html/wp-content/themes/nanashinotechmemo

  # WP-CLI (例: docker compose run --rm cli wp plugin list)
  cli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-tech}
    volumes:
      - ./.docker/wordpress:/var/www/html
      - ./dist:/var/www/html/wp-content/themes/nanashinotechmemo
